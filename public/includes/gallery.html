<section id="gallery" class="gallery-section">
  <div class="container">
    <div class="section-header sr">
      <span class="mono gold section-eyebrow">Visual Collection</span><h2>Derawan Gallery</h2>
      <p style="color:var(--muted);max-width:500px;margin:.8rem auto 0;">Photos loaded live from the dive-site archive — auto-updates when new files are added</p>
      <div class="filter-bar">
        <button class="filter-btn active" data-cat="all">All</button>
        <button class="filter-btn" data-cat="underwater">Underwater</button>
        <button class="filter-btn" data-cat="wildlife">Wildlife</button>
        <button class="filter-btn" data-cat="landscape">Landscape</button>
      </div>
    </div>
    <div class="gallery-status" id="galleryStatus"></div>
    <div class="masonry" id="galleryGrid">
      <div class="g-skeleton" style="height:220px"></div>
      <div class="g-skeleton" style="height:300px"></div>
      <div class="g-skeleton" style="height:180px"></div>
      <div class="g-skeleton" style="height:260px"></div>
      <div class="g-skeleton" style="height:220px"></div>
      <div class="g-skeleton" style="height:320px"></div>
    </div>
  </div>
</section>

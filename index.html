<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Derawan Dive Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=DM+Sans:wght@300;400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --ink:#08111e;--ink2:#0d1f35;--ink3:#0a1828;
      --teal:#1ab5c8;--teal-pale:rgba(26,181,200,.12);--teal-glow:#4dd9e8;--teal-mid:rgba(26,181,200,.25);
      --coral:#e05c4b;--sand:#f0e6c8;--sand-dim:rgba(240,230,200,.45);--sand-ghost:rgba(240,230,200,.18);
      --gold:#d4aa6a;--gold-dim:rgba(212,170,106,.5);
      --ease:cubic-bezier(.16,1,.3,1);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--sand);}

    /* ─── MAP ─── */
    #map{position:fixed;inset:0;z-index:1;transition:filter .7s var(--ease),transform .7s var(--ease);}
    body.cinematic-open{overflow:hidden !important;}
    body.cinematic-open #map{filter:blur(4px) brightness(.28);pointer-events:none;transform:scale(1.02);}
    .map-tiles{filter:brightness(.58) saturate(.6) hue-rotate(180deg) invert(1) contrast(.86);}

    /* ─── HEADER ─── */
    header{
      position:fixed;top:0;left:0;right:0;z-index:500;
      display:flex;align-items:center;justify-content:space-between;
      padding:18px 32px;
      background:linear-gradient(180deg,rgba(8,17,30,.97) 0%,rgba(8,17,30,.0) 100%);
      pointer-events:none;transition:opacity .5s,transform .5s var(--ease);
    }
    body.cinematic-open header{opacity:0;transform:translateY(-8px);pointer-events:none;}
    .brand{display:flex;align-items:baseline;gap:11px;pointer-events:all;}
    .brand-name{
      font-family:'Cinzel',serif;font-size:17px;letter-spacing:.15em;color:var(--sand);
      position:relative;padding-bottom:2px;
    }
    .brand-name::after{
      content:'';position:absolute;bottom:0;left:0;width:100%;height:1px;
      background:linear-gradient(90deg,var(--gold-dim),transparent);
    }
    .brand-loc{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--teal);font-weight:300;}
    #header-sub{
      font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
      color:var(--sand-ghost);pointer-events:none;
    }

    /* ─── COUNTER PILL ─── */
    #counter{
      position:fixed;top:20px;right:32px;z-index:500;
      display:flex;align-items:center;gap:8px;
      padding:6px 15px;
      background:rgba(8,17,30,.85);
      border:1px solid rgba(26,181,200,.18);
      border-radius:40px;backdrop-filter:blur(16px);
      font-family:'Space Mono',monospace;font-size:10px;color:var(--sand-ghost);letter-spacing:.09em;
      transition:opacity .5s,transform .5s var(--ease);
    }
    body.cinematic-open #counter{opacity:0;transform:translateY(-6px);}
    .ctr-dot{width:5px;height:5px;border-radius:50%;background:var(--teal);animation:pulse 2.4s ease-in-out infinite;flex-shrink:0;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.6);}}

    /* ─── BACK BUTTON ─── */
    #btn-back{
      position:fixed;top:17px;right:32px;left:auto;z-index:600;
      display:flex;align-items:center;gap:8px;
      padding:9px 18px 9px 13px;
      background:rgba(8,17,30,.9);
      border:1px solid rgba(26,181,200,.2);border-radius:40px;
      color:var(--teal);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
      cursor:pointer;opacity:0;transform:translateX(14px);pointer-events:none;
      transition:all .45s var(--ease);backdrop-filter:blur(16px);
    }
    #btn-back.on{opacity:1;transform:translateX(0);pointer-events:all;}
    #btn-back:hover{background:rgba(26,181,200,.12);border-color:var(--teal);color:var(--teal-glow);}
    #btn-back:hover .btn-back-arrow{transform:translateX(-3px);}
    .btn-back-arrow{transition:transform .25s var(--ease);}

    /* ─── ISLAND PANEL ─── */
    #island-panel{
      position:fixed;top:0;left:0;bottom:0;z-index:400;width:340px;
      background:rgba(6,14,26,.97);
      border-right:1px solid rgba(26,181,200,.08);
      backdrop-filter:blur(32px);
      transform:translateX(-100%);opacity:0;
      transition:transform .65s var(--ease),opacity .5s ease;
      display:flex;flex-direction:column;overflow:hidden;
      box-shadow:12px 0 60px rgba(0,0,0,.5);
    }
    #island-panel.on{transform:translateX(0);opacity:1;}
    body.cinematic-open #island-panel{transform:translateX(-100%);opacity:0;}

    /* Hero image */
    #island-hero{position:relative;width:100%;height:210px;flex-shrink:0;overflow:hidden;background:#050d18;}
    #island-hero img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.07);transition:transform 8s ease;}
    #island-hero.loaded img{transform:scale(1);}
    #island-hero-grad{
      position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(8,17,30,.1) 0%,rgba(8,17,30,.9) 100%),
                 linear-gradient(90deg,rgba(8,17,30,.3) 0%,transparent 60%);
    }
    #island-hero-label{position:absolute;bottom:16px;left:20px;right:20px;}
    #island-hero-label .ey{
      font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.26em;text-transform:uppercase;
      color:var(--teal);margin-bottom:5px;display:flex;align-items:center;gap:8px;
    }
    #island-hero-label .ey::before{content:'';width:18px;height:1px;background:var(--teal);opacity:.5;flex-shrink:0;}
    #island-hero-label .ttl{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;color:#fff;line-height:1.05;}

    /* Panel body */
    #island-body{
      flex:1;overflow-y:auto;padding:18px 20px 32px;
      scrollbar-width:thin;scrollbar-color:rgba(26,181,200,.12) transparent;
    }
    #island-body::-webkit-scrollbar{width:3px;}
    #island-body::-webkit-scrollbar-thumb{background:rgba(26,181,200,.18);border-radius:3px;}

    .island-desc{font-size:12px;font-weight:300;color:var(--sand-dim);line-height:1.85;margin-bottom:18px;}

    /* Stats row */
    .island-stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;}
    .ist{
      padding:7px 14px;
      background:rgba(26,181,200,.05);border:1px solid rgba(26,181,200,.13);
      border-radius:30px;display:flex;flex-direction:column;align-items:center;
      transition:background .25s,border-color .25s;
    }
    .ist:hover{background:rgba(26,181,200,.1);border-color:rgba(26,181,200,.28);}
    .ist-val{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--teal);line-height:1;}
    .ist-lbl{font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sand-ghost);margin-top:3px;}

    /* Sites list */
    .sites-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.04);}
    .sites-lbl{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--sand-ghost);}
    .sites-count{
      font-family:'Space Mono',monospace;font-size:8.5px;padding:2px 9px;
      border-radius:20px;background:rgba(26,181,200,.08);border:1px solid rgba(26,181,200,.16);color:var(--teal);
    }
    .site-row{
      display:flex;align-items:center;gap:11px;padding:9px 11px;
      border-radius:10px;background:rgba(26,181,200,.025);border:1px solid rgba(26,181,200,.07);
      cursor:pointer;margin-bottom:5px;
      transition:background .22s,border-color .22s,transform .22s var(--ease),box-shadow .22s;
    }
    .site-row:hover{background:rgba(26,181,200,.08);border-color:rgba(26,181,200,.25);transform:translateX(4px);box-shadow:4px 0 20px rgba(26,181,200,.06);}
    .site-row-thumb{width:44px;height:34px;border-radius:7px;overflow:hidden;flex-shrink:0;background:var(--ink2);border:1px solid rgba(255,255,255,.05);}
    .site-row-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .site-row-info{flex:1;min-width:0;}
    .site-row-name{font-size:12px;color:var(--sand);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .site-row-meta{font-family:'Space Mono',monospace;font-size:8.5px;color:var(--sand-ghost);margin-top:2px;letter-spacing:.04em;}
    .site-row-arr{color:rgba(26,181,200,.25);flex-shrink:0;transition:color .2s,transform .2s var(--ease);}
    .site-row:hover .site-row-arr{color:var(--teal);transform:translateX(3px);}

    /* ─── CINEMATIC TAKEOVER ─── */
    #cinematic{
      position:fixed;inset:0;z-index:800;
      opacity:0;pointer-events:none;
      transition:opacity .6s ease;
    }
    #cinematic.open{opacity:1;pointer-events:all;}
    #cin-track{
      position:absolute;inset:0;display:flex;
      transition:transform .7s var(--ease);will-change:transform;
    }
    .cin-slide{min-width:100vw;height:100vh;position:relative;flex-shrink:0;overflow:hidden;}
    .cin-slide img{
      width:100%;height:100%;object-fit:cover;display:block;
      transform:scale(1.06);transition:transform 10s ease;
    }
    .cin-slide.cur img{transform:scale(1);}
    .cin-grad{
      position:absolute;inset:0;
      background:
        linear-gradient(90deg,rgba(8,17,30,.92) 0%,rgba(8,17,30,.25) 52%,rgba(8,17,30,.0) 100%),
        linear-gradient(0deg,rgba(8,17,30,.98) 0%,rgba(8,17,30,.35) 38%,rgba(8,17,30,.0) 68%);
    }

    /* Cinematic info panel */
    #cin-info{
      position:absolute;bottom:0;left:0;top:0;width:clamp(380px,40vw,540px);
      display:flex;flex-direction:column;justify-content:flex-end;
      padding:0 clamp(32px,5vw,56px) clamp(48px,6vh,72px);
      pointer-events:none;
    }
    #cin-info>*{pointer-events:none;}
    #cinematic.open #cin-info>*{pointer-events:all;}

    #cin-eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
    .cin-island-label{font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.3);}
    .cin-eye-sep{width:28px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.2),transparent);}
    .cin-site-num{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.2em;color:rgba(255,255,255,.2);}

    #cin-diff{
      display:inline-flex;align-items:center;gap:7px;
      padding:5px 14px 5px 8px;border-radius:30px;border:1px solid currentColor;
      font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
      background:rgba(8,17,30,.5);backdrop-filter:blur(12px);
      width:fit-content;margin-bottom:14px;
    }
    #cin-diff-dot{width:5px;height:5px;border-radius:50%;background:currentColor;}

    #cin-title{
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(42px,6.5vw,82px);font-weight:300;font-style:italic;
      color:#fff;line-height:.92;letter-spacing:-.01em;
      text-shadow:0 6px 48px rgba(0,0,0,.7);margin-bottom:20px;
    }

    #cin-desc-wrap{
      display:flex;gap:16px;align-items:flex-start;
      border-top:1px solid rgba(255,255,255,.1);padding-top:16px;margin-bottom:24px;
    }
    .cin-rule-num{font-family:'Cormorant Garamond',serif;font-size:11px;color:rgba(255,255,255,.18);padding-top:2px;flex-shrink:0;}
    #cin-desc{font-size:12.5px;font-weight:300;color:rgba(255,255,255,.5);line-height:1.8;max-width:370px;}

    #cin-stats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px;}
    .cin-stat{
      padding:6px 15px;border-radius:30px;
      background:rgba(26,181,200,.06);border:1px solid rgba(26,181,200,.16);
      display:flex;flex-direction:column;align-items:center;
      transition:background .25s;
    }
    .cin-stat:hover{background:rgba(26,181,200,.12);}
    .cin-stat-v{font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--teal);line-height:1;}
    .cin-stat-l{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:var(--sand-ghost);margin-top:3px;}

    #cin-highlight{
      display:flex;align-items:center;gap:10px;padding:9px 16px;
      background:rgba(26,181,200,.07);border:1px solid rgba(26,181,200,.18);
      border-radius:10px;width:fit-content;margin-bottom:24px;
    }
    #cin-hi-icon{font-size:17px;}
    #cin-hi-label{font-size:11px;color:var(--teal-glow);font-weight:500;letter-spacing:.04em;}

    #cin-actions{display:flex;gap:10px;align-items:center;}
    #cin-gallery-btn{
      padding:10px 22px;border-radius:8px;
      background:rgba(26,181,200,.1);border:1px solid rgba(26,181,200,.32);
      color:var(--teal);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
      cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:8px;
    }
    #cin-gallery-btn:hover{background:rgba(26,181,200,.22);color:var(--teal-glow);border-color:var(--teal);}
    #cin-close-btn{
      width:40px;height:40px;border-radius:50%;
      background:rgba(8,17,30,.65);border:1px solid rgba(255,255,255,.1);
      color:rgba(255,255,255,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:all .22s;
    }
    #cin-close-btn:hover{background:rgba(224,92,75,.18);border-color:rgba(224,92,75,.35);color:var(--coral);}

    /* Filmstrip right panel */
    #cin-right{
      position:absolute;right:0;top:0;bottom:0;width:240px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:0 24px;gap:16px;
    }
    #cin-filmstrip{
      display:flex;flex-direction:column;gap:7px;
      max-height:55vh;overflow-y:auto;scrollbar-width:none;
      padding:4px 0;
    }
    #cin-filmstrip::-webkit-scrollbar{display:none;}
    .cin-film-thumb{
      width:78px;height:54px;border-radius:8px;overflow:hidden;flex-shrink:0;
      border:1.5px solid transparent;cursor:pointer;opacity:.3;
      transition:all .3s var(--ease);position:relative;
    }
    .cin-film-thumb:hover{opacity:.65;transform:scale(1.05);}
    .cin-film-thumb.cur{border-color:var(--teal);opacity:1;transform:scale(1.08);}
    .cin-film-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .cin-film-label{
      position:absolute;bottom:0;left:0;right:0;padding:2px 5px;
      background:linear-gradient(transparent,rgba(0,0,0,.75));
      font-family:'Space Mono',monospace;font-size:6.5px;color:rgba(255,255,255,.6);
      letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }

    #cin-counter{
      font-family:'Cormorant Garamond',serif;font-size:11px;
      color:rgba(255,255,255,.22);letter-spacing:.1em;text-align:center;
    }
    #cin-counter em{font-style:normal;font-size:24px;color:rgba(255,255,255,.45);display:block;line-height:1.1;}
    .cin-arrow{
      width:42px;height:42px;border-radius:50%;
      background:rgba(8,17,30,.68);border:1px solid rgba(26,181,200,.16);
      color:var(--teal);cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:all .22s var(--ease);backdrop-filter:blur(10px);
    }
    .cin-arrow:hover{background:rgba(26,181,200,.16);border-color:var(--teal);transform:scale(1.08);}
    #cin-dots{display:flex;gap:5px;justify-content:center;}
    .cin-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.18);cursor:pointer;transition:all .3s var(--ease);}
    .cin-dot.cur{background:#fff;transform:scale(1.7);}

    /* Top bar cinematic */
    #cin-top-close{
      position:absolute;top:24px;right:26px;
      width:42px;height:42px;border-radius:50%;
      background:rgba(8,17,30,.72);border:1px solid rgba(255,255,255,.09);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;color:rgba(255,255,255,.4);
      transition:all .22s;backdrop-filter:blur(14px);z-index:2;
    }
    #cin-top-close:hover{background:rgba(224,92,75,.18);border-color:rgba(224,92,75,.35);color:var(--coral);}
    #cin-top-label{
      position:absolute;top:24px;left:50%;transform:translateX(-50%);
      font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;
      color:rgba(255,255,255,.22);white-space:nowrap;
      background:rgba(8,17,30,.58);border:1px solid rgba(255,255,255,.06);
      padding:4px 16px;border-radius:20px;backdrop-filter:blur(12px);pointer-events:none;
    }
    #cin-caption{
      position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
      font-family:'Cormorant Garamond',serif;font-size:11px;font-style:italic;
      color:rgba(255,255,255,.18);white-space:nowrap;letter-spacing:.06em;
    }

    /* ─── LIGHTBOX ─── */
    #lightbox{
      position:fixed;inset:0;z-index:1200;
      background:rgba(4,8,16,.97);
      opacity:0;pointer-events:none;transition:opacity .4s ease;
      display:flex;align-items:center;justify-content:center;
    }
    #lightbox.open{opacity:1;pointer-events:all;}
    #lb-wrap{
      position:relative;
      max-width:calc(100vw - 160px);max-height:calc(100vh - 130px);
      border-radius:14px;overflow:hidden;
      border:1px solid rgba(26,181,200,.14);
      box-shadow:0 40px 100px rgba(0,0,0,.85);
    }
    #lb-img{display:block;max-width:100%;max-height:calc(100vh - 130px);object-fit:contain;transition:opacity .35s;}
    #lb-bar{
      position:absolute;bottom:0;left:0;right:0;
      padding:20px 24px 22px;
      background:linear-gradient(transparent,rgba(4,8,16,.94));
      pointer-events:none;
    }
    #lb-site{font-family:'Cormorant Garamond',serif;font-size:21px;color:#fff;margin-bottom:4px;}
    #lb-cap{font-family:'Space Mono',monospace;font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.06em;}
    .lb-nav{
      position:absolute;top:50%;transform:translateY(-50%);
      width:48px;height:48px;border-radius:50%;
      background:rgba(8,17,30,.82);border:1px solid rgba(26,181,200,.18);
      color:var(--teal);display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:all .2s var(--ease);backdrop-filter:blur(12px);
    }
    .lb-nav:hover{background:rgba(26,181,200,.18);border-color:var(--teal);transform:translateY(-50%) scale(1.08);}
    #lb-prev{left:18px;}#lb-next{right:18px;}
    #lb-close{
      position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;
      background:rgba(8,17,30,.82);border:1px solid rgba(255,255,255,.09);
      color:rgba(255,255,255,.38);display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:all .2s;
    }
    #lb-close:hover{background:rgba(224,92,75,.18);color:var(--coral);}
    #lb-idx{
      position:absolute;top:20px;left:20px;
      font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.14em;
      color:rgba(255,255,255,.22);
      background:rgba(8,17,30,.6);padding:4px 10px;border-radius:20px;backdrop-filter:blur(10px);
    }
    #lb-thumbs{
      position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
      display:flex;gap:6px;padding:7px 11px;
      background:rgba(4,8,16,.72);border:1px solid rgba(26,181,200,.1);
      border-radius:12px;backdrop-filter:blur(16px);
      max-width:calc(100vw - 120px);overflow-x:auto;scrollbar-width:none;
    }
    #lb-thumbs::-webkit-scrollbar{display:none;}
    .lb-th{
      flex-shrink:0;width:50px;height:36px;border-radius:6px;overflow:hidden;
      cursor:pointer;border:1.5px solid transparent;opacity:.35;transition:all .2s var(--ease);
    }
    .lb-th:hover{opacity:.7;transform:scale(1.05);}
    .lb-th.cur{border-color:var(--teal);opacity:1;}
    .lb-th img{width:100%;height:100%;object-fit:cover;display:block;}

    /* ─── LOADING SCREEN ─── */
    #loading{
      position:fixed;inset:0;background:var(--ink);z-index:9999;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
      transition:opacity .9s,visibility .9s;
    }
    #loading.gone{opacity:0;visibility:hidden;}
    .ld-brand{font-family:'Cinzel',serif;font-size:22px;letter-spacing:.25em;color:rgba(240,230,200,.12);margin-bottom:8px;}
    .ld-ring{
      width:52px;height:52px;
      border:1.5px solid rgba(26,181,200,.12);border-top-color:var(--teal);
      border-radius:50%;animation:spin 1.1s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    .ld-txt{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(240,230,200,.2);}

    /* ─── LEGEND ─── */
    #legend{
      position:fixed;bottom:26px;right:26px;z-index:400;
      background:rgba(6,14,26,.88);border:1px solid rgba(255,255,255,.05);
      border-radius:12px;padding:12px 16px;backdrop-filter:blur(18px);
      transition:opacity .5s,transform .5s var(--ease);
    }
    body.cinematic-open #legend{opacity:0;transform:translateY(6px);}
    .lg-row{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-family:'Space Mono',monospace;font-size:9px;color:var(--sand-dim);letter-spacing:.06em;}
    .lg-row:last-child{margin-bottom:0;}
    .lg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}

    /* ─── POPUP CARDS ─── */
    .leaflet-popup-content-wrapper{background:transparent!important;border:none!important;box-shadow:none!important;backdrop-filter:none!important;padding:0!important;overflow:visible!important;}
    .leaflet-popup-tip-container{display:none!important;}
    .leaflet-popup-content{margin:0!important;}
    .popup-card{
      width:262px;border-radius:14px;overflow:hidden;
      background:rgba(6,16,32,.97);border:1px solid rgba(26,181,200,.2);
      box-shadow:0 24px 60px rgba(0,0,0,.8);backdrop-filter:blur(28px);
      transform:translateY(4px);animation:popIn .25s var(--ease) forwards;
    }
    @keyframes popIn{to{transform:translateY(0);}}
    .pp-photo{position:relative;height:140px;overflow:hidden;background:var(--ink2);}
    .pp-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s;}
    .popup-card:hover .pp-photo img{transform:scale(1.07);}
    .pp-grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,rgba(6,16,32,.9) 100%);}
    .pp-badge{
      position:absolute;top:9px;left:9px;
      padding:3px 9px;border-radius:20px;
      font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
      border:1px solid currentColor;background:rgba(6,16,32,.52);
    }
    .pp-count{
      position:absolute;bottom:8px;right:9px;
      font-family:'Space Mono',monospace;font-size:7.5px;
      color:rgba(255,255,255,.45);background:rgba(4,10,20,.55);
      padding:2px 7px;border-radius:10px;
    }
    .pp-body{padding:12px 15px 14px;}
    .pp-tag{font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:3px;}
    .pp-name{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--sand);margin-bottom:5px;line-height:1.2;}
    .pp-desc{font-size:10.5px;color:var(--sand-dim);line-height:1.65;font-weight:300;margin-bottom:9px;}
    .pp-hi{display:flex;align-items:center;gap:7px;padding:6px 10px;background:rgba(26,181,200,.06);border:1px solid rgba(26,181,200,.14);border-radius:7px;}
    .pp-hi-icon{font-size:13px;}
    .pp-hi-txt{font-size:10px;color:var(--teal-glow);font-weight:500;}
    .island-ph{position:relative;overflow:hidden;}
    .island-ph img{width:100%;height:116px;object-fit:cover;display:block;transition:transform .6s;}
    .popup-card:hover .island-ph img{transform:scale(1.06);}
    .island-ph-grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(6,16,32,.88) 100%);}
    .pp-cta{
      margin-top:10px;width:100%;padding:9px 12px;
      background:linear-gradient(135deg,rgba(26,181,200,.14),rgba(26,181,200,.06));
      border:1px solid rgba(26,181,200,.3);border-radius:8px;
      color:var(--teal);font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
      cursor:pointer;transition:all .25s;display:block;text-align:center;
    }
    .pp-cta:hover{background:rgba(26,181,200,.24);color:var(--teal-glow);}

    /* ─── MAP MARKERS ─── */
    .mk-island{width:46px;height:46px;position:relative;cursor:pointer;}
    .mk-ring{position:absolute;inset:0;border:2px solid var(--teal);border-radius:50%;animation:rp 3s ease-in-out infinite;}
    .mk-ring2{position:absolute;inset:-9px;border:1px solid rgba(26,181,200,.2);border-radius:50%;animation:rp 3s ease-in-out .5s infinite;}
    .mk-core{
      position:absolute;inset:7px;
      background:radial-gradient(circle,var(--teal) 0%,#0c6272 100%);

      box-shadow:0 0 20px rgba(26,181,200,.35);

    .mk-core svg{width:14px;height:14px;color:white;}
    @keyframes rp{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.18);opacity:.45;}}
    .mk-dive{width:30px;height:30px;position:relative;cursor:pointer;}
    .mk-dive-dot{
      position:absolute;inset:6px;
      background:radial-gradient(circle,#f07c6e 0%,var(--coral) 100%);
      border-radius:50%;border:2px solid rgba(255,255,255,.28);
      box-shadow:0 0 14px rgba(224,92,75,.5);
    }
    .mk-dive-ring{position:absolute;inset:0;border:1.5px solid rgba(224,92,75,.36);border-radius:50%;animation:dp 2.5s ease-in-out infinite;}
    @keyframes dp{0%,100%{transform:scale(1);opacity:.75;}50%{transform:scale(1.35);opacity:0;}}

    /* ─── RESPONSIVE ─── */
    @media(max-width:700px){
      #island-panel{width:100%;top:auto;height:56vh;border-right:none;border-top:1px solid rgba(26,181,200,.12);border-radius:18px 18px 0 0;}
      #cin-info{width:100%;padding:0 22px 96px;}

      body.cinematic-open #island-panel{transform:translateY(100%);}
      header{padding:14px 18px;}
      #btn-back,#counter{top:14px;}
      #btn-back{right:18px;left:auto;}
      #counter{right:18px;}
    }
  </style>
</head>

<script>
/* ══════════════════════════════════════════════════════════════════════
   WATERMARK ENGINE v5 — CREDIT-FIRST, PHOTOGRAPHER-RESPECTFUL
   ────────────────────────────────────────────────────────────────────
   Upgrade dari v3 (file asli):
   ✦ Badge 3 baris hierarkis: nama fotografer / lokasi+tanggal / lisensi+situs
   ✦ Garis pemisah antar baris (gradient tipis)
   ✦ Aksen emas di top + bottom edge badge (rule gradient)
   ✦ Diagonal overlay lebih ringan (opacity dikurangi)
   ✦ Konfigurasi terpusat — 1 blok WM saja
   ✦ IntersectionObserver — stamp hanya saat gambar terlihat (perf)
   ✦ Per-site override: applyWatermark(img, { line2: '...' }) ← site name
   ✦ no-wm dihormati (popup thumbs, lightbox thumbs)
   ✦ WeakSet _done — tidak pernah double-stamp
   ══════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';

/* ─── KONFIGURASI ─── */
var WM = {
  photographer: 'Azman Rasyid',
  location:     'Kepulauan Derawan',
  date:         '04 Mar 2025',
  license:      'CC BY-NC 4.0',
  site:         'derawanarchipelago.id',
  position:     'br',          /* br | bl | tr | tl */
  badgeOpacity:  0.68,
  diagOpacity:   0.030,
  fontSize:      12,           /* base px, auto-scaled to image size */
  icon:          '\u25c8',
  quality:       0.90,
  skipClass:     'no-wm'
};

var _done = new WeakSet();
var _diagCache = null;

/* ── rounded rect ── */
function _rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

/* ── gold gradient rule ── */
function _rule(ctx, x1, x2, y, lw) {
  var g = ctx.createLinearGradient(x1, y, x2, y);
  g.addColorStop(0,   'rgba(212,170,106,0)');
  g.addColorStop(0.2, 'rgba(212,170,106,0.72)');
  g.addColorStop(0.8, 'rgba(212,170,106,0.72)');
  g.addColorStop(1,   'rgba(212,170,106,0)');
  ctx.save(); ctx.fillStyle = g;
  ctx.fillRect(x1, y, x2 - x1, lw);
  ctx.restore();
}

/* ── subtle inter-row separator ── */
function _sep(ctx, x1, x2, y) {
  var g = ctx.createLinearGradient(x1, y, x2, y);
  g.addColorStop(0,   'rgba(255,255,255,0)');
  g.addColorStop(0.3, 'rgba(255,255,255,0.12)');
  g.addColorStop(0.7, 'rgba(255,255,255,0.12)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.save(); ctx.fillStyle = g;
  ctx.fillRect(x1, y, x2 - x1, 0.5);
  ctx.restore();
}

/* ── diagonal ghost pattern (cached per session) ── */
function _getDiagPattern(ctx, cfg) {
  if (_diagCache) return _diagCache;
  var text = cfg.icon + '  ' + cfg.photographer + '  ·  ' + cfg.site;
  var tile = document.createElement('canvas');
  tile.width = 270; tile.height = 84;
  var tc = tile.getContext('2d');
  tc.font = '10px "Space Mono","Courier New",monospace';
  tc.fillStyle = 'rgba(212,170,106,' + cfg.diagOpacity + ')';
  tc.textAlign = 'left'; tc.textBaseline = 'top';
  tc.fillText(text, 0, 0);
  tc.font = '9px "Space Mono","Courier New",monospace';
  tc.fillStyle = 'rgba(212,170,106,' + (cfg.diagOpacity * 0.5) + ')';
  tc.fillText(cfg.license + '  ·  ' + cfg.date, 0, 18);
  _diagCache = ctx.createPattern(tile, 'repeat');
  return _diagCache;
}

function _drawDiag(ctx, nw, nh, cfg) {
  var pat = _getDiagPattern(ctx, cfg);
  if (!pat) return;
  ctx.save();
  ctx.translate(nw / 2, nh / 2);
  ctx.rotate(-Math.PI / 6);
  ctx.fillStyle = pat;
  ctx.fillRect(-nw, -nh, nw * 2, nh * 2);
  ctx.restore();
}

/* ── main stamp ── */
function _stamp(img, ov) {
  var cfg = {};
  var k; for (k in WM) cfg[k] = WM[k];
  if (ov) for (k in ov) cfg[k] = ov[k];

  try {
    var nw = img.naturalWidth, nh = img.naturalHeight;
    if (!nw || !nh) return;

    var cv = document.createElement('canvas');
    cv.width = nw; cv.height = nh;
    var ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, nw, nh);

    var base = Math.min(nw, nh);
    /* auto-scale font: clamp between (fontSize-2) and (fontSize+6) */
    var fs  = Math.min(cfg.fontSize + 6, Math.max(cfg.fontSize - 2, Math.round(base * 0.022)));
    var f1  = fs;
    var f2  = Math.round(fs * 0.88);
    var f3  = Math.round(fs * 0.80);
    var lh  = Math.round(fs * 1.62);
    var pad = Math.round(base * 0.022);
    var gap = Math.round(fs * 0.7);

    /* badge text rows */
    var r1 = cfg.icon + '  ' + cfg.photographer;
    /* override: if caller passes locationLine, use it for row 2 */
    var r2 = (cfg.locationLine) ? cfg.locationLine : (cfg.location + '  ·  ' + cfg.date);
    var r3 = cfg.license + '  ·  ' + cfg.site;

    /* measure widths */
    ctx.font = f1 + 'px "Space Mono","Courier New",monospace';
    var w1 = ctx.measureText(r1).width;
    ctx.font = f2 + 'px "Space Mono","Courier New",monospace';
    var w2 = ctx.measureText(r2).width;
    ctx.font = f3 + 'px "Space Mono","Courier New",monospace';
    var w3 = ctx.measureText(r3).width;

    var innerW = Math.max(w1, w2, w3);
    var bW = innerW + gap * 2 + 4;
    var bH = lh * 3 + gap * 2 + 2;
    var r  = Math.round(fs * 0.55);

    var bx, by;
    var pos = cfg.position;
    bx = (pos === 'bl' || pos === 'tl') ? pad : nw - pad - bW;
    by = (pos === 'tr' || pos === 'tl') ? pad : nh - pad - bH;

    /* draw diagonal overlay */
    _drawDiag(ctx, nw, nh, cfg);

    /* ── badge background ── */
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur  = Math.round(fs * 1.5);
    ctx.shadowOffsetY = Math.round(fs * 0.3);
    ctx.globalAlpha = cfg.badgeOpacity;
    ctx.fillStyle   = 'rgba(4,10,14,0.80)';
    _rr(ctx, bx, by, bW, bH, r); ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

    /* top highlight gradient */
    var hl = ctx.createLinearGradient(bx, by, bx, by + bH * 0.45);
    hl.addColorStop(0, 'rgba(255,255,255,0.055)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl; _rr(ctx, bx, by, bW, bH, r); ctx.fill();

    /* border */
    ctx.strokeStyle = 'rgba(212,170,106,0.48)';
    ctx.lineWidth   = Math.max(0.5, fs * 0.042);
    _rr(ctx, bx + 0.25, by + 0.25, bW - 0.5, bH - 0.5, r); ctx.stroke();
    ctx.restore();

    /* ── accent lines ── */
    var lx1 = bx + gap, lx2 = bx + bW - gap;
    _rule(ctx, lx1, lx2, by + 1,        Math.max(0.5, fs * 0.055));
    _rule(ctx, lx1, lx2, by + bH - 1.5, Math.max(0.5, fs * 0.055));

    /* ── row 1: photographer name ── */
    var ty = by + gap + 1;
    ctx.shadowColor = 'rgba(0,0,0,0.95)'; ctx.shadowBlur = 6;
    ctx.fillStyle   = 'rgba(255,255,255,0.96)';
    ctx.font = f1 + 'px "Space Mono","Courier New",monospace';
    ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    ctx.fillText(r1, bx + gap, ty);

    _sep(ctx, bx + gap, bx + bW - gap, ty + lh - 2);

    /* ── row 2: location · date (or override) ── */
    ty += lh;
    ctx.fillStyle = 'rgba(212,170,106,0.88)';
    ctx.font = f2 + 'px "Space Mono","Courier New",monospace';
    ctx.fillText(r2, bx + gap, ty);

    _sep(ctx, bx + gap, bx + bW - gap, ty + lh - 2);

    /* ── row 3: license · site ── */
    ty += lh;
    ctx.fillStyle = 'rgba(255,255,255,0.40)';
    ctx.font = f3 + 'px "Space Mono","Courier New",monospace';
    ctx.fillText(r3, bx + gap, ty);

    ctx.shadowBlur = 0;
    img.src = cv.toDataURL('image/jpeg', cfg.quality);
  } catch(e) { /* cross-origin taint — skip silently */ }
}

/* ── schedule via IntersectionObserver (perf: stamp only when visible) ── */
var _io = new IntersectionObserver(function(entries) {
  entries.forEach(function(e) {
    if (!e.isIntersecting) return;
    var img = e.target, ov = img._wmOv;
    _io.unobserve(img);
    if (img.complete && img.naturalWidth > 0) _stamp(img, ov);
    else img.addEventListener('load', function() { _stamp(img, ov); }, { once: true });
  });
}, { rootMargin: '250px' });

function scheduleWM(img, ov) {
  if (!img || img.tagName !== 'IMG') return;
  if (_done.has(img)) return;
  if (img.classList.contains(WM.skipClass)) return;
  _done.add(img);
  if (ov) img._wmOv = ov;
  _io.observe(img);
}

/* ── force re-stamp with override (cinematic & hero images) ── */
function applyWatermark(img, ov) {
  if (!img || img.tagName !== 'IMG') return;
  if (img.classList.contains(WM.skipClass)) return;
  _done.delete(img);      /* allow re-stamp */
  _io.unobserve(img);
  if (ov) img._wmOv = ov;
  _done.add(img);
  function doStamp() { _stamp(img, ov); }
  if (img.complete && img.naturalWidth > 0) doStamp();
  else img.addEventListener('load', doStamp, { once: true });
}

window.applyWatermark = applyWatermark;
window.WM_CONFIG = WM;

/* ── MutationObserver — auto-stamp injected images, skip popup thumbs ── */
var _obs = new MutationObserver(function(mutations) {
  mutations.forEach(function(m) {
    m.addedNodes.forEach(function(node) {
      if (node.nodeType !== 1) return;
      /* popup/thumbnail images: mark no-wm so they stay clean */
      if (node.classList &&
          (node.classList.contains('popup-card') || node.classList.contains('site-row-thumb'))) {
        if (node.querySelectorAll)
          node.querySelectorAll('img').forEach(function(i){ i.classList.add('no-wm'); });
        return;
      }
      if (node.tagName === 'IMG' && !node.classList.contains('no-wm')) scheduleWM(node);
      if (node.querySelectorAll) {
        node.querySelectorAll('img:not(.no-wm)').forEach(function(img) {
          if (img.closest && img.closest('.popup-card,.site-row-thumb,.lb-th')) return;
          scheduleWM(img);
        });
      }
    });
  });
});
_obs.observe(document.body, { childList: true, subtree: true });

})(); /* end WM v5 */

function dc(d) {
  return d === 'Pemula' ? '#4dd9e8' : d === 'Menengah' ? '#f0c060' : '#f07c6e';
}
function hi(h) {
  const m = {
    Nudibranch:'🐛','Giant Frogfish':'🐸',Orca:'🐋',Turtle:'🐢',
    Barracuda:'🐟','Moray Eel':'🐍','Orangutan Crab':'🦀',
    'Devil Ray':'🐠',Cave:'🕳️','Garden Eel':'🐍',
    'Schooling Jack Fish':'🐟','Hard Coral':'🪸',
    'Tiger Shark':'🦈',Hiu:'🦈','Reef Shark':'🦈'
  };
  return m[h] || '✦';
}

/* build locationLine for watermark override */
function _siteLabel(site, island) {
  return site.name + '  ·  ' + island.name;
}

  clrM(diveMks);
  ISLANDS.forEach(island => {
    const cover = island.diveSites.find(s => s.photos?.length)?.photos[0].src || '';
    const coverHTML = cover
      ? `<div class="island-ph"><img src="${cover}" alt="${island.name}" class="no-wm" onerror="this.closest('.island-ph').style.display='none'"><div class="island-ph-grad"></div></div>` : '';

      <div style="display:flex;gap:10px;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.05)">

      <button class="pp-cta" onclick="zoomToIsland('${island.id}')">Jelajahi Dive Sites →</button>
    </div></div>`;
    const mk = L.marker([island.lat, island.lng], { icon: mkIslandIcon() });
    mk.bindPopup(html, { maxWidth: 266 });
    mk.on('click', () => mk.openPopup());
    mk.addTo(map);
    islandMks.push(mk);
  });
}

function zoomToIsland(id) {
  const island = ISLANDS.find(i => i.id === id);
  if (!island) return;
  activeIsland = island; lvl = 2;
  map.closePopup();
  islandMks.forEach(m => m.remove()); islandMks = [];
  map.flyTo([island.lat, island.lng], 13, { duration: 1.2, easeLinearity: .5 });

  setTimeout(() => {
    clrM(diveMks);
    island.diveSites.forEach((site, i) => {
      setTimeout(() => {
        if (site.lat === null) return;
        const mk = L.marker([site.lat, site.lng], { icon: mkDiveIcon() });
        mk.siteName = site.name;
        const col = dc(site.difficulty);
        const cover = site.photos?.length ? site.photos[0].src : '';
        const pCount = site.photos?.length || 0;
        const photoBlock = cover
          ? `<div class="pp-photo"><img src="${cover}" alt="${site.name}" class="no-wm" onerror="this.closest('.pp-photo').style.display='none'">
             <div class="pp-grad"></div>
             <div class="pp-badge" style="color:${col}">${site.difficulty}</div>
             ${pCount > 1 ? `<div class="pp-count">${pCount} foto</div>` : ''}</div>` : '';
        const html = `<div class="popup-card">${photoBlock}<div class="pp-body">
          <div class="pp-tag" style="color:${col}">${site.difficulty}${site.depth !== '—' ? ' · ' + site.depth : ''}</div>
          <div class="pp-name">${site.name}</div>
          <div class="pp-desc">${site.desc}</div>
          ${site.highlight && site.highlight !== '—'
            ? `<div class="pp-hi"><span class="pp-hi-icon">${hi(site.highlight)}</span><span class="pp-hi-txt">${site.highlight}</span></div>` : ''}
        </div></div>`;
        mk.bindPopup(html, { maxWidth: 266 });
        mk.on('click', () => { mk.openPopup(); openCinematic(site, island); });
        mk.addTo(map); diveMks.push(mk);
      }, i * 75);
    });
  }, 820);

  showIslandPanel(island);
}

  document.getElementById('ih-ey').textContent = 'Pulau Terpilih';

  const ihImg = document.getElementById('ih-img');
  const ihEl  = document.getElementById('island-hero');
  ihEl.classList.remove('loaded');

  if (cover) {
    ihImg.classList.remove('no-wm');
    ihImg.src = '';
    ihImg.onload = function () {
      ihEl.classList.add('loaded');

      applyWatermark(ihImg, { locationLine: island.name + '  ·  Kepulauan Derawan' });
    };

  }

  document.getElementById('ib-desc').textContent = island.desc;
  document.getElementById('ib-count').textContent = island.diveCount;
  document.getElementById('ib-stats').innerHTML = `

  }).join('');

  document.getElementById('island-panel').classList.add('on');

function onSiteRowClick(islandId, siteName) {
  const island = ISLANDS.find(i => i.id === islandId);
  if (!island) return;
  const site = island.diveSites.find(s => s.name === siteName);
  if (!site) return;
  if (site.lat !== null) {
    diveMks.forEach(m => {
      if (m.siteName === site.name) {
        map.panTo([site.lat, site.lng], { animate: true, duration: .6 });
        m.fire('click');
      }
    });
  } else {
    openCinematic(site, island);
  }
}

function goBack() {
  if (lvl === 1) return;
  lvl = 1; activeIsland = null;
  clrM(diveMks); map.closePopup();
  closeCinematic();
  map.flyTo([2.18, 118.45], 10, { duration: 1.2, easeLinearity: .5 });
  setTimeout(() => renderIslands(), 600);
  document.getElementById('btn-back').classList.remove('on');
  document.getElementById('header-sub').textContent = 'Eksplorasi 4 Pulau Utama';
  document.getElementById('counter-text').textContent = '4 pulau tersedia';
  document.getElementById('island-panel').classList.remove('on');
}

function clrM(arr) { arr.forEach(m => m.remove()); arr.length = 0; }

/* ══════════════════════════════════
   CINEMATIC TAKEOVER
══════════════════════════════════ */
let cinPhotos = [], cinIdx = 0, cinSite = null, cinIsland = null;

function openCinematic(site, island) {
  cinSite = site; cinIsland = island;
  cinPhotos = site.photos || [];
  cinIdx = 0;
  if (!cinPhotos.length) return;

  buildCinTrack();
  fillCinInfo();
  buildFilmstrip();
  buildCinDots();

  const cin = document.getElementById('cinematic');
  cin.classList.add('open');
  cin.style.pointerEvents = 'all';
  document.body.classList.add('cinematic-open');

  /* ── stamp cinematic images with per-site override ── */
  const label = _siteLabel(site, island);
  setTimeout(() => {
    document.querySelectorAll('#cin-track img, #cin-filmstrip img').forEach(img => {
      if (!img.classList.contains('no-wm')) {
        applyWatermark(img, { locationLine: label });
      }
    });
  }, 280);
}

function closeCinematic() {
  const cin = document.getElementById('cinematic');
  cin.classList.remove('open');
  cin.style.pointerEvents = 'none';
  document.body.classList.remove('cinematic-open');
  if (map) {
    map.closePopup();
  }
}

function buildCinTrack() {
  const track = document.getElementById('cin-track');
  track.innerHTML = cinPhotos.map((p, i) => `
    <div class="cin-slide${i === 0 ? ' cur' : ''}">
      <img src="${p.src}" alt="${p.caption}" loading="${i === 0 ? 'eager' : 'lazy'}" onerror="this.closest('.cin-slide').style.display='none'">
      <div class="cin-grad"></div>
    </div>`).join('');
  track.style.transform = 'translateX(0)';
}

function fillCinInfo() {
  const s = cinSite, isl = cinIsland;
  const col = dc(s.difficulty);
  document.getElementById('cin-island-lbl').textContent = isl ? isl.name : '—';
  const siteIdx = (isl ? isl.diveSites.findIndex(x => x.name === s.name) : 0) + 1;
  const total   = isl ? isl.diveSites.length : 1;
  document.getElementById('cin-site-num').textContent  = `Site ${String(siteIdx).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;
  document.getElementById('cin-diff').style.color      = col;
  document.getElementById('cin-diff-dot').style.background = col;
  document.getElementById('cin-diff-txt').textContent  = s.difficulty;
  document.getElementById('cin-title').textContent     = s.name;
  document.getElementById('cin-rule-n').textContent    = String(siteIdx).padStart(2, '0');
  document.getElementById('cin-desc').textContent      = s.desc;
  document.getElementById('cin-top-label').textContent = s.name;

  const stats = [];
  if (s.depth !== '—') stats.push({ v: s.depth, l: 'Kedalaman' });
  stats.push({ v: s.difficulty, l: 'Level', col });
  if (cinPhotos.length > 1) stats.push({ v: cinPhotos.length, l: 'Foto' });
  document.getElementById('cin-stats').innerHTML = stats.map(st => `
    <div class="cin-stat">
      <div class="cin-stat-v" style="${st.col ? 'color:' + st.col : ''}">${st.v}</div>
      <div class="cin-stat-l">${st.l}</div>
    </div>`).join('');

  const hiEl = document.getElementById('cin-highlight');
  if (s.highlight && s.highlight !== '—') {
    document.getElementById('cin-hi-icon').textContent = hi(s.highlight);
    document.getElementById('cin-hi-label').textContent = s.highlight;
    hiEl.style.display = 'flex';
  } else { hiEl.style.display = 'none'; }

  updateCinCaption();
}

function buildFilmstrip() {
  const fs = document.getElementById('cin-filmstrip');
  fs.innerHTML = cinPhotos.map((p, i) => `
    <div class="cin-film-thumb${i === 0 ? ' cur' : ''}" onclick="goToCin(${i})">
      <img src="${p.src}" alt="" loading="lazy" onerror="this.closest('.cin-film-thumb').style.display='none'">
      <div class="cin-film-label">${p.caption}</div>
    </div>`).join('');
  const show = cinPhotos.length > 1;
  fs.style.display = show ? 'flex' : 'none';
  document.getElementById('cin-counter').style.display = show ? 'block' : 'none';
  document.querySelectorAll('.cin-arrow').forEach(a => a.style.display = show ? 'flex' : 'none');
  updateCinCount();
}

function buildCinDots() {
  const d = document.getElementById('cin-dots');
  if (cinPhotos.length <= 1 || cinPhotos.length > 8) { d.style.display = 'none'; return; }
  d.style.display = 'flex';
  d.innerHTML = cinPhotos.map((_, i) =>
    `<div class="cin-dot${i === 0 ? ' cur' : ''}" onclick="goToCin(${i})"></div>`).join('');
}

function goToCin(n) {
  if (n === cinIdx) return;
  const slides = document.querySelectorAll('.cin-slide');
  const thumbs = document.querySelectorAll('.cin-film-thumb');
  const dots   = document.querySelectorAll('.cin-dot');
  slides[cinIdx]?.classList.remove('cur');
  thumbs[cinIdx]?.classList.remove('cur');
  dots[cinIdx]?.classList.remove('cur');
  cinIdx = ((n % cinPhotos.length) + cinPhotos.length) % cinPhotos.length;
  slides[cinIdx]?.classList.add('cur');
  thumbs[cinIdx]?.classList.add('cur');
  dots[cinIdx]?.classList.add('cur');
  document.getElementById('cin-track').style.transform = `translateX(-${cinIdx * 100}vw)`;
  updateCinCaption(); updateCinCount();
  thumbs[cinIdx]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function cinNav(dir) { goToCin(cinIdx + dir); }

function updateCinCaption() {
  const p = cinPhotos[cinIdx];
  document.getElementById('cin-caption').textContent = p?.caption || '';
  document.getElementById('cin-cur').textContent = `${cinIdx + 1}/${cinPhotos.length}`;
}
function updateCinCount() {
  document.getElementById('cin-cur').textContent = `${cinIdx + 1}/${cinPhotos.length}`;
}

/* swipe */
document.getElementById('cinematic').addEventListener('touchstart', e => {
  e.currentTarget._tx = e.touches[0].clientX;
}, { passive: true });
document.getElementById('cinematic').addEventListener('touchend', e => {
  const dx = e.currentTarget._tx - e.changedTouches[0].clientX;
  if (Math.abs(dx) > 50) cinNav(dx > 0 ? 1 : -1);
});

/* keyboard */
document.addEventListener('keydown', e => {
  const cin = document.getElementById('cinematic').classList.contains('open');
  const lb  = document.getElementById('lightbox').classList.contains('open');
  if (cin) {
    if (e.key === 'Escape') closeCinematic();
    if (e.key === 'ArrowRight') cinNav(1);
    if (e.key === 'ArrowLeft')  cinNav(-1);
  }
  if (lb) {
    if (e.key === 'Escape') closeLB();
    if (e.key === 'ArrowRight') lbNav(1);
    if (e.key === 'ArrowLeft')  lbNav(-1);
  }
});

/* ══════════════════════════════════
   GALLERY LIGHTBOX
══════════════════════════════════ */
let lbPhotos = [], lbIdx = 0, lbSite = null;

function openGalleryLightbox() {
  if (!cinSite || !cinPhotos.length) return;
  lbPhotos = cinPhotos; lbIdx = cinIdx; lbSite = cinSite;
  renderLB(); buildLBThumbs();
  document.getElementById('lightbox').classList.add('open');
}
function closeLB() { document.getElementById('lightbox').classList.remove('open'); }
function lbNav(dir) {
  lbIdx = (lbIdx + dir + lbPhotos.length) % lbPhotos.length;
  renderLB(); updateLBThumbs();
}
function lbGoTo(i) { lbIdx = i; renderLB(); updateLBThumbs(); }
function renderLB() {
  const p   = lbPhotos[lbIdx];
  const img = document.getElementById('lb-img');
  img.style.opacity = '0'; img.src = p.src;
  img.onload = () => img.style.opacity = '1';
  document.getElementById('lb-site').textContent = lbSite?.name || '';
  document.getElementById('lb-cap').textContent  = p.caption || '';
  document.getElementById('lb-idx').textContent  = `${lbIdx + 1} / ${lbPhotos.length}`;
  document.getElementById('lb-prev').style.display = lbPhotos.length > 1 ? 'flex' : 'none';
  document.getElementById('lb-next').style.display = lbPhotos.length > 1 ? 'flex' : 'none';
}
function buildLBThumbs() {
  const r = document.getElementById('lb-thumbs');
  if (lbPhotos.length <= 1) { r.style.display = 'none'; return; }
  r.style.display = 'flex';
  r.innerHTML = lbPhotos.map((p, i) =>
    `<div class="lb-th${i === lbIdx ? ' cur' : ''}" onclick="lbGoTo(${i})">
      <img src="${p.src}" class="no-wm" onerror="this.closest('.lb-th').style.display='none'">
    </div>`).join('');
}
function updateLBThumbs() {
  document.querySelectorAll('.lb-th').forEach((t, i) => t.classList.toggle('cur', i === lbIdx));
  document.querySelector('.lb-th.cur')?.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox')) closeLB();
});
</script>
